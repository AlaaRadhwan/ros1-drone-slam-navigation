<div class="takeoff-slider-div">

    <!-- ------- TAKE OFF BUTON ------- -->
    <div class="takeoff-button">
        <form id="takeoffForm">
            <label for="altitude">Takeoff Alt:</label>
            <input type="text" id="altitude" name="altitude" placeholder="Enter Altitude">
            <button type="button" id="takeoffButton" class="control-buttons" data-button-id="takeoff">SEND</button>
        </form>

        <script src="{{ url_for('static', filename='js/buttonsScripts/takeoffScript.js') }}"></script>   
    </div>

    <!-- ------- YAW INPUT CONTROLS ------- -->
    <div class="takeoff-button">
        <form id="yawForm">
            <label for="yaw">Yaw:</label>
            <input type="text" id="yaw" name="yaw" placeholder="Enter Yaw">
            <button type="button" id="yawButton" class="control-buttons" data-button-id="yaw">SEND</button>
        </form>

        <script src="{{ url_for('static', filename='js/buttonsScripts/takeoffScript.js') }}"></script>   
    </div>

    <!-- ------- ALTITUDE INPUT CONTROLS ------- -->
    <div class="takeoff-button">
        <form id="altForm">
            <label for="freeAlt">Change Alt:</label>
            <input type="text" id="freeAlt" name="freeAlt" placeholder="Enter Altitude">
            <button type="button" id="altButton" class="control-buttons" data-button-id="freeAlt">SEND</button>
        </form>

        <script src="{{ url_for('static', filename='js/buttonsScripts/takeoffScript.js') }}"></script>   
    </div>

</div>
